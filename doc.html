<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css.css">
  <body>
    <div id="header"></div>
  </body>
  
</html>
<script>
fetch("index.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    // fetch 끝난 후에 실행해야 함 (중요)
    const page = localStorage.getItem("page");

    if (page === "1") {
      const innerContent = document
        .getElementById("header")
        .querySelector("#content");

      if (innerContent) {
        innerContent.innerHTML = `
          <ul>
            메신저봇R 요약<br><br>
메신저봇R은 안드로이드 스마트폰의 알림을 읽어 카카오톡, 라인 등의 메신저에 자동 답장을 보낼 수 있게 해주는 자동 응답 봇 제작 애플리케이션입니다.<br><br>
자바스크립트 지원: Rhino 또는 V8 엔진을 사용하여 JavaScript 코드로 복잡한 기능을 직접 구현할 수 있습니다.<br><br>
2. 설치 및 설정 방법<br><br>
준비물: 안드로이드 기기(공신폰 등 사용하지 않는 기기 권장) 및 구글 플레이 스토어에서 메신저 봇 R 설치.<br><br>
필수 권한: 앱이 정상 작동하려면 알림 읽기 권한과 데이터 접근 권한을 반드시 허용해야 합니다.<br><br>
봇 생성: 앱 내에서 새 봇을 생성하고 레거시 API 또는 최신 API를 선택하여 스크립트를 작성합니다.
          </ul>
        `;
      }
    }
  });
</script>
