<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>퀴즈</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>

  <div id="header">
    <div id="content">
      <div id="setup-area">
        <h2>문제를 선택하세요</h2>
        <button class="btn btn-category" onclick="selectCategory('stone')">선사시대</button>
        <button class="btn btn-category" onclick="selectCategory('math')">🔢 수학 퀴즈</button>
      </div>

      <div id="quiz-area" class="hidden">
        <h3 id="question-text">질문 준비 중...</h3>
        <input type="text" id="user-answer" placeholder="답을 적고 엔터를 누르세요" onkeypress="if(event.keyCode==13) submitAnswer()">
        <button class="btn" onclick="submitAnswer()">정답 확인</button>
        <div id="feedback"></div>
      </div>

      <div id="result-area" class="hidden">
        <h2>퀴즈 종료!</h2>
        <p id="final-score" style="font-size: 1.2em;"></p>
        <button class="btn" onclick="location.reload()">처음으로 돌아가기</button>
      </div>
    </div>
  </div>

  <script>
    const quizDb = {
      stone: [
        { q: "주먹도끼는 어느 시대의 유물인가 (~기)?", a: "구석기" },
        { q: "사냥이나 채집을 주로 하였던 시대는? (~기)?", a: "구석기" },
        { q: "간석기는 어느 시대? (~기)", a: "식석기" },
        { q: "구석기에는 움집에 살았다 예/아니", a: "아니" },
        { q: "청동기는 최초의 00사회였다", a: "계급" },
        { q: "구석기 말에는 날씨가 비교적 (따뜻했다 / 추웠다)", a: "따뜻했다" },
        { q: "구석기에는 0집에 살았다", a: "막" },
        { q: "구석기의 시작은 기원전 oo만년 전이다", a: "70" },
        { q: "신석기의 시작은 기원전 oooo년 전이다", a: "8000" },
        { q: "연나라는 중국 동북쪽에 있다 예/아니", a: "예" },
        { q: "군장은 어느 시기에 등장했는가? (~기)", a: "청동기" },
        { q: "고조선은 어떤 나라에 멸망했는가?", a: "한" },
        { q: "고조선은 한 군현이 설치되지 이전 법률은 무엇인가?", a: "8조법" },
        { q: "신석기에는 농사가 주돤 식량 공급원이였다. 예/아니", a: "아니" }
      ],
      math: [
        { q: "5 x 9 = ?", a: "45" },
        { q: "100 - 37 = ?", a: "63" },
        { q: "2의 3제곱은?", a: "8" },
        { q: "7 x 8 = ?", a: "56" },
        { q: "150 나누기 3은?", a: "50" }
      ]
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 배열을 무작위로 섞는 함수 (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function selectCategory(type) {
      // 문제를 복사한 뒤 무작위로 섞음
      currentQuestions = shuffleArray([...quizDb[type]]); 
      currentIndex = 0;
      score = 0;
      
      document.getElementById('setup-area').classList.add('hidden');
      document.getElementById('quiz-area').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      if (currentIndex < currentQuestions.length) {
        document.getElementById('question-text').innerText = currentQuestions[currentIndex].q;
        document.getElementById('user-answer').value = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('user-answer').focus();
      } else {
        showFinalResult();
      }
    }

    function submitAnswer() {
      const userVal = document.getElementById('user-answer').value.trim();
      const correctVal = currentQuestions[currentIndex].a;
      const feedback = document.getElementById('feedback');

      if (userVal === correctVal) {
        score++;
        feedback.innerHTML = "<span style='color:blue'>⭕ 정답!</span>";
      } else {
        feedback.innerHTML = `<span style='color:red'>❌ 오답 (정답: ${correctVal})</span>`;
      }

      setTimeout(() => {
        currentIndex++;
        showQuestion();
      }, 800);
    }

    function showFinalResult() {
      document.getElementById('quiz-area').classList.add('hidden');
      document.getElementById('result-area').classList.remove('hidden');
      document.getElementById('final-score').innerText = 
        `총 ${currentQuestions.length}개 중 ${score}개를 맞혔습니다!`;
    }
  </script>
</body>
</html>
