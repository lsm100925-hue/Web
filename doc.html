<div id="header"></div>
<div id="content"></div>

<script>
fetch("header.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;
  });

const data = localStorage.getItem("page");

if (data === "1") {
  document.getElementById("content").innerHTML = `
    <ul>
      <li>메신저봇?</li>
      <li>나는</li>
      <li>몰라요</li>
    </ul>
  `;
}
</script>
