<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css.css">
  <title>역사 학습 사이트</title>
</head>
<body>

  <div id="header">
    <h1>📜 역사 학습 사이트</h1>
    <p>1학년 9반 친구들을 위한 공간입니다.</p>
    
    <div class="box" style="margin: 20px 0; padding: 15px; background: #f1f3f5; border-radius: 10px; font-size: 0.9em;">
      원하는 메뉴를 선택하여 학습을 시작하세요!
    </div>

    <div id="menu-area">
      <button class="btn" onclick="location.href='index.html'">🏠 메인 화면</button>
      <button class="btn btn-category" onclick="goToQuiz(1)">✍️ 역사 퀴즈 풀기</button>
    </div>

    <div id="footer" style="margin-top: 20px; color: #888; font-size: 0.8em;">
      &copy; 2026 1-9 History Class
    </div>
  </div>

  <script>
    function goToQuiz(value) {
      // 로컬 스토리지에 페이지 상태 저장
      localStorage.setItem("page", String(value));
      // doc.html로 이동
      location.href = "doc.html";
    }
  </script>

</body>
</html>
