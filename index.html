<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>승민위키</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f6f7;
    }

    header {
      background-color: #2d2f34;
      color: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      display: flex;
    }

    nav {
      width: 220px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      padding: 15px;
    }

    nav a {
      display: block;
      text-decoration: none;
      color: #0366d6;
      margin: 8px 0;
    }

    main {
      flex: 1;
      padding: 20px;
      background: white;
    }

    h1 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }

    .box {
      background: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      border-left: 4px solid #0366d6;
    }
  </style>
</head>
<body>

<header>승민위키</header>

<div class="container">
  <nav>
    <b>목차</b>
    <a href="#">메인</a>
    <a href="#">프로그래밍</a>
    <a href="#">기타</a>
  </nav>

  <main>
    <h1>메인 페이지</h1>

    <div class="box">
      여기는 승민위키입니다.
    </div>

    <h2>소개</h2>
    <p>아래에 설명이 나옵니다.</p>

    <h2>목차</h2>
    <ul>
      <li>아직 내용이 없습니다</li>
    </ul>

  </main>
</div>

</body>
</html>
